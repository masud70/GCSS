<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{head}}
    <meta name="theme-color" content="{{themeLight}}" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="{{themeDark}}" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{favicon}}" type="image/svg+xml">
    <script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
    <link rel="preload" href="/assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
    {{preloadItalic}}
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/main.js" defer></script>
    <noscript><style>#menu-btn, #theme-btn, .drawer-head { display: none !important; } @media (max-width: 63.99rem) { #site-nav { position: static !important; width: 100% !important; height: auto !important; transform: none !important; visibility: visible !important; box-shadow: none !important; border: 0 !important; background: none !important; } .dd-panel { display: block; } }</style></noscript>
  </head>
  <body class="flex min-h-screen flex-col bg-bg text-body antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-primary focus:px-4 focus:py-2 focus:text-on-primary">Skip to content</a>

    <header id="site-header" class="sticky top-0 z-40 border-b border-line">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-3 px-4 lg:gap-x-6">
        <a href="/" class="flex h-16 items-center gap-3" aria-label="{{siteName}} home">
          {{logoMark}}
          <span class="leading-tight">
            <span class="block text-xl font-bold leading-none tracking-tight text-ink">{{shortName}}</span>
            <span class="mt-0.5 block text-xs text-muted">University of Manitoba</span>
          </span>
        </a>

        <div class="flex items-center gap-1 lg:order-last">
          <button id="theme-btn" type="button" class="rounded-md p-2 text-body hover:bg-tint hover:text-ink" aria-label="Switch color theme" title="Switch color theme">
            <svg class="light-only size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            <svg class="dark-only size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button id="menu-btn" type="button" class="rounded-md p-2 text-body hover:bg-tint lg:hidden" aria-controls="site-nav" aria-expanded="false" aria-label="Menu">
            <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>

        <nav id="site-nav" aria-label="Main" class="lg:ml-auto">
          <div class="drawer-head">
            <span class="text-sm font-semibold tracking-wide text-muted uppercase">Menu</span>
            <button id="nav-close" type="button" class="rounded-md p-2 text-body hover:bg-tint" aria-label="Close menu">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <ul class="flex flex-col gap-1 lg:flex-row lg:items-center">{{nav}}</ul>
        </nav>
        <div class="nav-backdrop" aria-hidden="true"></div>
      </div>
    </header>

    {{hero}}
    <main id="main" class="mx-auto w-full {{mainWidth}} flex-1 px-4 {{mainPad}}">
      <article class="prose max-w-none" data-layout="{{layout}}">
        {{content}}
      </article>
    </main>

    <footer class="mt-8 border-t border-line bg-surface text-sm">
      <div class="mx-auto flex max-w-6xl flex-col items-center gap-6 px-4 py-8 text-center md:flex-row md:justify-between md:text-left">
        <a href="/" class="inline-flex items-center gap-3 text-left" aria-label="{{siteName}} home">
          {{logoMark}}
          <span class="leading-tight">
            <span class="block text-base font-bold tracking-tight text-ink">{{siteName}} <span class="font-semibold text-muted">({{shortName}})</span></span>
            <span class="mt-0.5 block text-xs text-muted">University of Manitoba</span>
          </span>
        </a>
        <div class="flex items-center gap-1">{{social}}</div>
      </div>
      <div class="border-t border-line">
        <div class="mx-auto flex max-w-6xl flex-col items-center gap-2 px-4 py-4 text-xs text-muted md:flex-row md:justify-between">
          <p class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1">&copy; {{year}} {{shortName}}{{related}}</p>
          <a class="hover:text-link hover:underline" href="#">Back to top <span aria-hidden="true">&uarr;</span></a>
        </div>
      </div>
    </footer>
  </body>
</html>
